# V-ADJ-TYPE: в forbidden указан неизвестный тип Z (space_manager: exit 2)
grid:
  width: 10
  height: 10

blockedFile: null
presetFile: null

types:
  A: { symbol: "A", name: null }
  B: { symbol: "B", name: null }

rules:
  connectivity: 8
  adjacency:
    forbidden:
      - [A, Z]
    allow: null
  size:
    min: null
    max: null
  convexity:
    weight: soft
  fillAll: false
  touchAll: false

clusters:
  - id: c1
    type: A
    areaPercent: 40
    shape: free
  - id: c2
    type: B
    areaPercent: 30
    shape: free
