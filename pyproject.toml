[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spaec-manager"
version = "0.1.0"
description = "Размещение замкнутых кластеров на пиксельной сетке W x H"
requires-python = ">=3.9"
dependencies = ["PyYAML"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["spaec_manager"]
